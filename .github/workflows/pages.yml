name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/3d-sheep-herding-mwbene
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, so no manual setup is needed.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static and served straight from the repository root.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
